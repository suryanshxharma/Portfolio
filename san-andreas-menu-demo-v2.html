<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>San Andreas Menu — Portfolio Demo v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=UnifrakturMaguntia&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --dim:#4a5a66;
    --lit:#cfe6f2;
    --ice:#8fb8cc;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; height:100%; background:#000;
    font-family:'Rajdhani', sans-serif;
    overflow:hidden;
  }

  .stage{
    position:relative; width:100%; height:100vh;
    background:#000;
  }

  /* corner photo, top right, fixed image per screen */
  .corner-photo{
    position:absolute; top:0; right:0;
    width:min(32vw, 480px); height:min(26vh, 230px);
    overflow:hidden;
    clip-path: polygon(18% 0%, 100% 0%, 100% 100%, 0% 65%);
    transition:opacity .35s ease;
  }
  .corner-photo img{
    width:100%; height:100%; object-fit:cover;
    filter:saturate(0.9) contrast(1.05);
  }
  .corner-photo::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(200deg, rgba(0,0,0,0) 40%, rgba(0,0,0,.85) 100%);
  }

  /* blackletter header, top left */
  .header{
    position:absolute; top:30px; left:32px; z-index:5;
    font-family:'UnifrakturMaguntia', cursive;
    font-size:clamp(24px, 3vw, 34px);
    color:var(--lit);
    text-shadow:0 0 12px rgba(160,200,220,.35);
    transition:opacity .25s ease;
  }

  /* back link bottom-right */
  .back-link{
    position:absolute; bottom:26px; right:36px; z-index:5;
    font-size:13px; letter-spacing:4px; color:var(--dim);
    text-transform:uppercase; cursor:pointer;
    transition:color .15s ease;
  }
  .back-link:hover{ color:var(--lit); }
  .back-link.hidden{ display:none; }

  /* menu container position varies: centered for main, left-aligned for submenus */
  .menu-wrap{
    position:absolute; z-index:4;
    display:flex; flex-direction:column;
    transition:opacity .3s ease;
  }
  .menu-wrap.center{
    left:50%; top:50%; transform:translate(-50%,-50%);
    align-items:center;
  }
  .menu-wrap.left{
    left:74px; top:270px;
    align-items:flex-start;
  }

  .menu-item{
    position:relative;
    font-size:clamp(15px, 1.6vw, 19px);
    font-weight:600;
    letter-spacing:6px;
    color:var(--dim);
    text-transform:uppercase;
    padding:9px 0;
    cursor:pointer;
    transition:color .15s ease;
    display:flex; align-items:center; gap:10px;
  }
  .menu-item .glyph{
    opacity:0; transform:translateX(-6px) scale(.8);
    transition:opacity .15s ease, transform .15s ease;
    font-size:15px;
    color:var(--lit);
  }
  .menu-item.active{
    color:var(--lit);
    text-shadow:0 0 10px rgba(160,210,230,.5);
  }
  .menu-item.active .glyph{
    opacity:1; transform:translateX(0) scale(1);
  }

  .screen{
    position:absolute; inset:0;
    transition:opacity .3s ease;
  }
  .screen.leaving{ opacity:0; pointer-events:none; }
  .screen.entering{ opacity:0; }
  .screen.entered{ opacity:1; }

  .hint{
    position:absolute; bottom:16px; left:50%; transform:translateX(-50%);
    color:#333; font-size:11px; letter-spacing:2px; text-transform:uppercase;
    z-index:5;
  }
</style>
</head>
<body>

<div class="stage" id="stage">
  <div class="header" id="header">Main menu</div>

  <div class="screen entered" id="screen-main">
    <div class="corner-photo"><img src="https://images.unsplash.com/photo-1502920917128-1aa500764cbd?q=80&w=1200&auto=format&fit=crop" alt=""></div>
    <div class="menu-wrap center">
      <div class="menu-item" data-target="game"><span class="glyph">✦</span>Start Game</div>
      <div class="menu-item" data-target="map"><span class="glyph">✦</span>Map</div>
      <div class="menu-item" data-target="options"><span class="glyph">✦</span>Options</div>
      <div class="menu-item" data-target="quit"><span class="glyph">✦</span>Quit Game</div>
    </div>
  </div>

  <div class="back-link hidden" id="backLink">Back</div>
  <div class="hint">click an item to navigate · demo for style reference only</div>
</div>

<script>
  const stage = document.getElementById('stage');
  const header = document.getElementById('header');
  const backLink = document.getElementById('backLink');

  const PHOTO = {
    main:    'https://images.unsplash.com/photo-1502920917128-1aa500764cbd?q=80&w=1200&auto=format&fit=crop',
    game:    'https://images.unsplash.com/photo-1519501025264-65ba15a82390?q=80&w=1200&auto=format&fit=crop',
    map:     'https://images.unsplash.com/photo-1524661135-423995f22d0b?q=80&w=1200&auto=format&fit=crop',
    options: 'https://images.unsplash.com/photo-1487958449943-2429e8be8625?q=80&w=1200&auto=format&fit=crop',
    quit:    'https://images.unsplash.com/photo-1470770903676-69b98201ea1c?q=80&w=1200&auto=format&fit=crop'
  };

  const MENUS = {
    main: {
      header: 'Main menu',
      layout: 'center',
      items: [
        { label: 'Start Game', target: 'game' },
        { label: 'Map', target: 'map' },
        { label: 'Options', target: 'options' },
        { label: 'Quit Game', target: 'quit' },
      ],
      back: null
    },
    game: {
      header: 'Game',
      layout: 'left',
      items: [
        { label: 'New Game', target: 'game' },
        { label: 'Load Game', target: 'game' },
        { label: 'Delete Game', target: 'game' },
      ],
      back: 'main'
    },
    map: {
      header: 'Map',
      layout: 'left',
      items: [
        { label: 'Los Santos', target: 'map' },
        { label: 'San Fierro', target: 'map' },
        { label: 'Las Venturas', target: 'map' },
      ],
      back: 'main'
    },
    options: {
      header: 'Options',
      layout: 'left',
      items: [
        { label: 'Audio Setup', target: 'options' },
        { label: 'Display Setup', target: 'options' },
        { label: 'Controller Setup', target: 'options' },
        { label: 'Language', target: 'options' },
      ],
      back: 'main'
    },
    quit: {
      header: 'Quit Game',
      layout: 'left',
      items: [
        { label: 'Confirm Quit', target: 'quit' },
      ],
      back: 'main'
    }
  };

  let busy = false;

  function buildScreen(key){
    const data = MENUS[key];
    const screen = document.createElement('div');
    screen.className = 'screen entering';

    const photo = document.createElement('div');
    photo.className = 'corner-photo';
    const img = document.createElement('img');
    img.src = PHOTO[key] || PHOTO.main;
    photo.appendChild(img);
    screen.appendChild(photo);

    const wrap = document.createElement('div');
    wrap.className = 'menu-wrap ' + data.layout;

    data.items.forEach(item => {
      const el = document.createElement('div');
      el.className = 'menu-item';
      el.dataset.target = item.target;
      el.innerHTML = '<span class="glyph">✦</span>' + item.label;
      wrap.appendChild(el);
      attachHandlers(el, item.target);
    });

    screen.appendChild(wrap);
    return screen;
  }

  function attachHandlers(el, target){
    el.addEventListener('mouseenter', () => {
      document.querySelectorAll('.menu-item.active').forEach(i => i.classList.remove('active'));
      el.classList.add('active');
    });
    el.addEventListener('click', () => navigate(target));
  }

  function navigate(targetKey){
    if (busy) return;
    busy = true;

    const oldScreen = stage.querySelector('.screen.entered, .screen');
    const newScreen = buildScreen(targetKey);
    stage.insertBefore(newScreen, backLink);

    header.style.opacity = 0;

    const data = MENUS[targetKey];
    if (data.back){
      backLink.classList.remove('hidden');
      backLink.onclick = () => navigate(data.back);
    } else {
      backLink.classList.add('hidden');
    }

    requestAnimationFrame(() => {
      oldScreen.classList.remove('entered');
      oldScreen.classList.add('leaving');
      newScreen.classList.remove('entering');
      newScreen.classList.add('entered');
      setTimeout(() => {
        header.textContent = data.header;
        header.style.opacity = 1;
      }, 160);
    });

    setTimeout(() => {
      oldScreen.remove();
      busy = false;
    }, 320);
  }

  document.querySelectorAll('#screen-main .menu-item').forEach(el => {
    attachHandlers(el, el.dataset.target);
  });
</script>

</body>
</html>
